document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

;justify-content:space-between;align-items:center;margin-top:28px\">\n    <span style=\"display:flex;align-items:center;gap:10px;font-size:14px;letter-spacing:0.04em;color:#c3cad0;font-weight:500\"><span style=\"width:7px;height:7px;border-radius:50%;background:#2fbf71\"><\u002Fspan>DEMO · DEXCOM G7<\u002Fspan>\n    <span style=\"padding:6px 12px;border-radius:14px;background:#103534;color:#4fdfdc;font-size:14px;font-weight:600\">{{ rangeChip }}<\u002Fspan>\n  <\u002Fdiv>\n\n  <div style=\"position:relative;margin:18px auto 0;width:100%;max-width:360px;aspect-ratio:1\">\n    <svg sc-camel-view-box=\"0 0 360 360\" style=\"width:100%;height:100%;display:block\" aria-hidden=\"true\">\n      <circle cx=\"180\" cy=\"180\" r=\"156\" style=\"fill:none;stroke:#2a2d31;stroke-width:22\"><\u002Fcircle>\n      <circle cx=\"180\" cy=\"180\" r=\"128\" style=\"fill:none;stroke:#3a3f44;stroke-width:3;stroke-dasharray:0 22;stroke-linecap:round\"><\u002Fcircle>\n      <circle cx=\"180\" cy=\"180\" r=\"156\" transform=\"rotate(-90 180 180)\" style=\"fill:none;stroke:#4fdfdc;stroke-width:22;stroke-linecap:round;stroke-dasharray:{{ ring.inDash }}\"><\u002Fcircle>\n      <circle cx=\"180\" cy=\"180\" r=\"156\" transform=\"rotate({{ ring.highRot }} 180 180)\" style=\"fill:none;stroke:#ff8b85;stroke-width:22;stroke-linecap:round;stroke-dasharray:{{ ring.highDash }}\"><\u002Fcircle>\n      <circle cx=\"{{ ring.dotX }}\" cy=\"{{ ring.dotY }}\" r=\"11\" style=\"fill:#4fdfdc;stroke:#0f1113;stroke-width:4\"><\u002Fcircle>\n    <\u002Fsvg>\n    <div style=\"position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center\">\n      <div style=\"font-size:15px;color:#c3cad0\">Today, October 10<\u002Fdiv>\n      <div style=\"font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:76px;line-height:1;letter-spacing:-0.03em;margin-top:6px\">{{ current }}<\u002Fdiv>\n      <div style=\"font-size:18px;color:#c3cad0;margin-top:4px\">mg/dL<\u002Fdiv>\n      <div style=\"font-size:18px;font-weight:700;color:#4fdfdc;margin-top:18px\">→ Looking steady.<\u002Fdiv>\n      <div style=\"font-size:13px;color:#c3cad0;margin-top:6px\">Demo reading · 2 min ago<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"display:flex;justify-content:center;gap:18px;font-size:13px;color:#9aa3ab;margin-top:6px\">\n    <span style=\"display:flex;align-items:center;gap:6px\"><span style=\"width:10px;height:10px;border-radius:50%;background:#4fdfdc\"><\u002Fspan>In range today<\u002Fspan>\n    <span style=\"display:flex;align-items:center;gap:6px\"><span style=\"width:10px;height:10px;border-radius:50%;background:#ff8b85\"><\u002Fspan>Above 140<\u002Fspan>\n  <\u002Fdiv>\n\n  <section aria-label=\"Prediction status\" style=\"margin-top:24px;background:#1f2225;border-radius:22px;padding:18px\">\n    <div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:10px\">\n      <span style=\"font-size:17px;font-weight:700\">{{ phase.title }}<\u002Fspan>\n      <span style=\"font-size:14px;color:#9aa3ab\">{{ phase.dayText }}<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:4px;margin-top:12px\">\n      <sc-for list=\"{{ phase.segs }}\" as=\"sg\" hint-placeholder-count=\"8\"><span style=\"height:6px;border-radius:3px;background:{{ sg.bg }}\"><\u002Fspan><\u002Fsc-for>\n    <\u002Fdiv>\n    <div style=\"display:flex;justify-content:space-between;font-size:12px;color:#7d868e;margin-top:6px\"><span>Days 1–7 · learning<\u002Fspan><span>Day 8 · predictions<\u002Fspan><\u002Fdiv>\n    <p style=\"margin:10px 0 0;font-size:14px;line-height:1.5;color:#c3cad0\">{{ phase.body }}<\u002Fp>\n  <\u002Fsection>\n\n  <section aria-label=\"Glucose today\" style=\"margin-top:28px\">\n    <svg sc-camel-view-box=\"0 0 360 150\" style=\"width:100%;height:auto;display:block;background:#12201d;border-radius:4px\" role=\"img\" aria-label=\"Glucose from 7 AM to 5 PM\">\n      <defs><linearGradient id=\"gl-fill\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\"><stop offset=\"0\" stop-color=\"#5ee3a0\" stop-opacity=\"0.35\"><\u002Fstop><stop offset=\"1\" stop-color=\"#5ee3a0\" stop-opacity=\"0\"><\u002Fstop><\u002FlinearGradient><\u002Fdefs>\n      <path d=\"{{ chart.area }}\" fill=\"url(#gl-fill)\"><\u002Fpath>\n      <path d=\"{{ chart.line }}\" style=\"fill:none;stroke:#5ee3a0;stroke-width:3;stroke-linecap:round\"><\u002Fpath>\n      <sc-for list=\"{{ chart.meals }}\" as=\"cm\">\n        <circle cx=\"{{ cm.x }}\" cy=\"{{ cm.y }}\" r=\"5\" style=\"fill:#0f1113;stroke:{{ cm.color }};stroke-width:2.5\"><\u002Fcircle>\n      <\u002Fsc-for>\n    <\u002Fsvg>\n    <div style=\"display:flex;justify-content:space-between;padding:12px 4px 0 30px;font-size:13px;color:#c3cad0\">\n      <sc-for list=\"{{ chart.labels }}\" as=\"lb\" hint-placeholder-count=\"11\"><span>{{ lb }}<\u002Fspan><\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <div style=\"height:1px;background:#24272b;margin:24px 0\"><\u002Fdiv>\n\n  <div style=\"display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px\">\n    <div style=\"background:#1f2225;border-radius:22px;padding:18px 16px\">\n      <div style=\"font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:28px\">{{ tir }}%<\u002Fdiv>\n      <div style=\"font-size:14px;color:#c3cad0;margin-top:2px\">Time in range<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:#1f2225;border-radius:22px;padding:18px 16px\">\n      <div style=\"font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:28px\">{{ avg }}<\u002Fdiv>\n      <div style=\"font-size:14px;color:#c3cad0;margin-top:2px\">Avg glucose<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:#1f2225;border-radius:22px;padding:18px 16px\">\n      <div style=\"font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:28px\">{{ carbsToday }}g<\u002Fdiv>\n      <div style=\"font-size:14px;color:#c3cad0;margin-top:2px\">Carbs today<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <h2 style=\"font-size:19px;font-weight:700;margin:30px 0 12px\">Meals today<\u002Fh2>\n  <div style=\"display:flex;flex-direction:column;gap:0\">\n    <sc-for list=\"{{ todayMeals }}\" as=\"tm\" hint-placeholder-count=\"2\">\n      <div style=\"display:flex;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid #24272b\">\n        <span style=\"width:44px;height:44px;flex:0 0 auto;border-radius:14px;background:repeating-linear-gradient(135deg,#1f2225 0 6px,#25292d 6px 12px);display:flex;align-items:center;justify-content:center;font-family:'Space Grotesk',sans-serif;font-weight:700;color:#9aa3ab\">{{ tm.initial }}<\u002Fspan>\n        <div style=\"flex:1;min-width:0\">\n          <div style=\"font-size:16px;font-weight:700\">{{ tm.name }}<\u002Fdiv>\n          <div style=\"font-size:13px;color:#9aa3ab\">{{ tm.time }} · {{ tm.carbs }}g carbs · {{ tm.peakText }}<\u002Fdiv>\n        <\u002Fdiv>\n        <span style=\"padding:5px 10px;border-radius:12px;font-size:13px;font-weight:600;background:{{ tm.chipBg }};color:{{ tm.chipFg }}\">{{ tm.status }}<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n\n  <h2 style=\"font-size:19px;font-weight:700;margin:30px 0 12px\">Connected sources<\u002Fh2>\n  <div style=\"display:flex;flex-direction:column;gap:10px\">\n    <sc-for list=\"{{ sources }}\" as=\"src\" hint-placeholder-count=\"3\">\n      <div style=\"display:flex;align-items:center;gap:14px;background:#2a2d31;border-radius:22px;padding:14px 16px\">\n        <span style=\"width:44px;height:44px;flex:0 0 auto;border-radius:50%;background:#103534;color:#4fdfdc;display:flex;align-items:center;justify-content:center\"><svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"{{ src.icon }}\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n        <div style=\"flex:1;min-width:0\">\n          <div style=\"font-size:16px;font-weight:600\">{{ src.name }}<\u002Fdiv>\n          <div style=\"font-size:14px;color:#9aa3ab\">{{ src.sub }}<\u002Fdiv>\n        <\u002Fdiv>\n        <span style=\"display:flex;align-items:center;gap:6px;color:#5ee3a0;font-size:15px;font-weight:500\"><svg width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M20 6 9 17l-5-5\"><\u002Fpath><\u002Fsvg>Synced<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n\n  <div style=\"height:1px;background:#24272b;margin:22px 0\"><\u002Fdiv>\n  <button sc-camel-on-click=\"{{ goLog }}\" style=\"width:100%;display:flex;align-items:center;gap:16px;text-align:left;background:#0f2523;border:1px dashed #2f6d69;border-radius:22px;padding:20px;color:#f2f4f5;cursor:pointer;font-family:'Manrope',sans-serif\">\n    <span style=\"width:60px;height:60px;flex:0 0 auto;border-radius:50%;background:#4fdfdc;color:#0f1113;display:flex;align-items:center;justify-content:center\"><svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3zM12 16a3 3 0 1 0 0-6 3 3 0 0 0 0 6z\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n    <span><span style=\"display:block;font-size:17px;font-weight:700\">Log your next meal<\u002Fspan><span style=\"display:block;font-size:15px;color:#c3cad0;margin-top:2px\">Snap a photo, scan a barcode, or type it in<\u002Fspan><\u002Fspan>\n  <\u002Fbutton>\n  <p style=\"font-size:12px;color:#7d868e;margin:20px 0 0\">Wellness insight, not medical advice.<\u002Fp>\n<\u002Fmain>\n<\u002Fsc-if>\n\n<!-- LOG MEAL -->\n<sc-if value=\"{{ isLog }}\" hint-placeholder-val=\"{{ false }}\">\n<main data-screen-label=\"Log meal\" style=\"padding:20px 20px 0\">\n  <div style=\"font-size:14px;letter-spacing:0.08em;color:#4fdfdc;font-weight:700\">LOG A MEAL<\u002Fdiv>\n  <h1 style=\"font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:32px;letter-spacing:-0.02em;margin:4px 0 18px\">What's on the plate?<\u002Fh1>\n  <sc-if value=\"{{ showLearningNote }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"margin:-4px 0 18px;border-radius:22px;padding:16px 18px;background:#1f2225\">\n      <div style=\"font-size:13px;letter-spacing:0.06em;color:#4fdfdc;font-weight:700\">STILL LEARNING · DAY {{ programDay }} OF 7<\u002Fdiv>\n      <p style=\"margin:6px 0 0;font-size:15px;line-height:1.5;color:#e3e7ea\">{{ learningNote }}<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n  <div role=\"tablist\" style=\"display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;background:#25282c;border-radius:26px;padding:5px\">\n    <sc-for list=\"{{ modes }}\" as=\"md\" hint-placeholder-count=\"3\">\n      <button role=\"tab\" aria-selected=\"{{ md.active }}\" sc-camel-on-click=\"{{ md.select }}\" style=\"height:44px;border-radius:22px;border:none;background:{{ md.bg }};color:{{ md.fg }};display:flex;align-items:center;justify-content:center;gap:8px;font:500 16px 'Manrope',sans-serif;cursor:pointer\">\n        <svg width=\"17\" height=\"17\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"{{ md.icon }}\"><\u002Fpath><\u002Fsvg>{{ md.label }}\n      <\u002Fbutton>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n\n  <sc-if value=\"{{ showPhotoZone }}\" hint-placeholder-val=\"{{ false }}\">\n    <label style=\"position:relative;margin-top:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;aspect-ratio:1.3;border:2px dashed #2f6d69;border-radius:28px;background:#172022;cursor:pointer;overflow:hidden;text-align:center;padding:20px\">\n      <input type=\"file\" accept=\"image/*\" capture=\"environment\" sc-camel-on-change=\"{{ onFile }}\" style=\"position:absolute;width:1px;height:1px;opacity:0\">\n      {{ photoImg }}\n      <sc-if value=\"{{ noPhoto }}\" hint-placeholder-val=\"{{ false }}\">\n        <svg width=\"40\" height=\"40\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#4fdfdc\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3zM12 16a3 3 0 1 0 0-6 3 3 0 0 0 0 6z\"><\u002Fpath><\u002Fsvg>\n        <span style=\"font-size:18px;font-weight:700;margin-top:8px\">Snap your meal or nutrition label<\u002Fspan>\n        <span style=\"font-size:15px;color:#9aa3ab\">We'll fill in the macros below<\u002Fspan>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ analyzing }}\" hint-placeholder-val=\"{{ false }}\">\n        <span style=\"position:relative;padding:8px 14px;border-radius:16px;background:#0f1113;color:#4fdfdc;font-size:14px;font-weight:600;animation:gl-pulse 1.2s ease-in-out infinite\">Reading your meal…<\u002Fspan>\n      <\u002Fsc-if>\n    <\u002Flabel>\n    <button sc-camel-on-click=\"{{ trySample }}\" style=\"margin-top:10px;width:100%;height:44px;border-radius:22px;border:1px solid #2a2d31;background:transparent;color:#c3cad0;font:600 14px 'Manrope',sans-serif;cursor:pointer\">No photo handy? Try a sample meal<\u002Fbutton>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ showBarcode }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"margin-top:22px;aspect-ratio:1.3;border-radius:28px;background:#172022;border:2px dashed #2f6d69;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px;text-align:center\">\n      <div style=\"width:70%;height:70px;border:2px solid #4fdfdc;border-radius:12px;display:flex;align-items:center;justify-content:center\"><div style=\"width:85%;height:2px;background:#ff8b85;animation:gl-pulse 1.2s ease-in-out infinite\"><\u002Fdiv><\u002Fdiv>\n      <span style=\"font-size:18px;font-weight:700\">Line up the barcode<\u002Fspan>\n      <button sc-camel-on-click=\"{{ scanBarcode }}\" style=\"height:40px;padding:0 16px;border-radius:20px;border:none;background:#103534;color:#4fdfdc;font:600 14px 'Manrope',sans-serif;cursor:pointer\">Scan a sample barcode<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <div style=\"margin-top:22px\">\n    <label for=\"gl-name\" style=\"display:block;font-size:14px;color:#c3cad0;margin-bottom:8px\">Food name<\u002Flabel>\n    <input id=\"gl-name\" value=\"{{ form.name }}\" sc-camel-on-change=\"{{ setName }}\" placeholder=\"e.g. Homemade dal &amp; rice\" style=\"width:100%;height:52px;border-radius:20px;border:1px solid #33373b;background:#25282c;color:#f2f4f5;padding:0 16px;font:500 16px 'Manrope',sans-serif\">\n  <\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:16px\">\n    <div><label for=\"gl-c\" style=\"display:block;font-size:14px;color:#c3cad0;margin-bottom:8px\">Carbs (g)<\u002Flabel><input id=\"gl-c\" inputmode=\"numeric\" value=\"{{ form.c }}\" sc-camel-on-change=\"{{ setC }}\" style=\"width:100%;height:52px;border-radius:20px;border:1px solid #33373b;background:#25282c;color:#f2f4f5;padding:0 14px;font:600 16px 'Manrope',sans-serif\"><\u002Fdiv>\n    <div><label for=\"gl-p\" style=\"display:block;font-size:14px;color:#c3cad0;margin-bottom:8px\">Protein (g)<\u002Flabel><input id=\"gl-p\" inputmode=\"numeric\" value=\"{{ form.p }}\" sc-camel-on-change=\"{{ setP }}\" style=\"width:100%;height:52px;border-radius:20px;border:1px solid #33373b;background:#25282c;color:#f2f4f5;padding:0 14px;font:600 16px 'Manrope',sans-serif\"><\u002Fdiv>\n    <div><label for=\"gl-f\" style=\"display:block;font-size:14px;color:#c3cad0;margin-bottom:8px\">Fat (g)<\u002Flabel><input id=\"gl-f\" inputmode=\"numeric\" value=\"{{ form.f }}\" sc-camel-on-change=\"{{ setF }}\" style=\"width:100%;height:52px;border-radius:20px;border:1px solid #33373b;background:#25282c;color:#f2f4f5;padding:0 14px;font:600 16px 'Manrope',sans-serif\"><\u002Fdiv>\n  <\u002Fdiv>\n\n  <sc-if value=\"{{ predLoading }}\" hint-placeholder-val=\"{{ false }}\">\n    <div role=\"status\" style=\"margin-top:20px;border-radius:22px;padding:18px;background:#1f2225;font-size:15px;color:#c3cad0;animation:gl-pulse 1.2s ease-in-out infinite\">Checking this meal against your first 7 days…<\u002Fdiv>\n  <\u002Fsc-if>\n  <sc-if value=\"{{ hasPrediction }}\" hint-placeholder-val=\"{{ false }}\">\n    <div role=\"status\" style=\"margin-top:20px;border-radius:22px;padding:18px;background:{{ pred.bg }}\">\n      <div style=\"font-size:14px;color:#c3cad0\">Based on your first 7 days<\u002Fdiv>\n      <div style=\"font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:30px;color:{{ pred.fg }};margin-top:2px\">{{ pred.label }}<\u002Fdiv>\n      <div style=\"display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:8px;font-size:14px;color:#c3cad0\">\n        <span>Spike chance <strong style=\"color:#f2f4f5\">{{ pred.prob }}%<\u002Fstrong><\u002Fspan>\n        <span>Peak <strong style=\"color:#f2f4f5\">~{{ pred.peak }} mg/dL<\u002Fstrong><\u002Fspan>\n        <span>{{ pred.conf }} confidence<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:14px\">\n        <sc-for list=\"{{ pred.h }}\" as=\"hz\" hint-placeholder-count=\"4\">\n          <div style=\"background:#0f1113;border-radius:14px;padding:10px 4px;text-align:center\"><div style=\"font-size:12px;color:#9aa3ab\">{{ hz.label }}<\u002Fdiv><div style=\"font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:21px;color:{{ hz.color }}\">{{ hz.v }}<\u002Fdiv><div style=\"font-size:11px;color:#9aa3ab\">{{ hz.clock }}<\u002Fdiv><\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <p style=\"margin:10px 0 0;font-size:15px;line-height:1.45;color:#f2f4f5;font-weight:600\">{{ pred.peakText }}<\u002Fp>\n      <p style=\"margin:4px 0 0;font-size:13px;color:#c3cad0\">{{ pred.medsNote }}<\u002Fp>\n      <p style=\"margin:12px 0 0;font-size:15px;line-height:1.45;color:#e3e7ea\">{{ pred.tip }}<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <button sc-camel-on-click=\"{{ saveMeal }}\" disabled=\"{{ cantSave }}\" style=\"width:100%;height:52px;margin-top:22px;border-radius:26px;border:none;background:#4fdfdc;color:#0f1113;font:700 17px 'Manrope',sans-serif;cursor:pointer;opacity:{{ saveOpacity }}\">Save meal<\u002Fbutton>\n<\u002Fmain>\n<\u002Fsc-if>\n\n<!-- CALENDAR -->\n<sc-if value=\"{{ isCalendar }}\" hint-placeholder-val=\"{{ false }}\">\n<main data-screen-label=\"Calendar\" style=\"padding:20px 20px 0\">\n  <header style=\"display:flex;justify-content:space-between;align-items:center\">\n    <div style=\"font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:34px;letter-spacing:-0.03em\"><span style=\"color:#4fdfdc\">gly<\u002Fspan><span style=\"color:#ff8b85\">mpse<\u002Fspan><\u002Fdiv>\n    <span style=\"padding:7px 14px;border-radius:16px;border:1px solid #33373b;font-size:12px;color:#c3cad0;letter-spacing:0.04em\">DEMO MODE<\u002Fspan>\n  <\u002Fheader>\n  <div style=\"font-size:14px;letter-spacing:0.08em;color:#4fdfdc;font-weight:700;margin-top:28px\">YOUR CALENDAR<\u002Fdiv>\n  <h1 style=\"font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:34px;letter-spacing:-0.02em;margin:4px 0 0\">A little look back.<\u002Fh1>\n  <p style=\"margin:8px 0 0;font-size:15px;line-height:1.5;color:#c3cad0\">{{ calNote }}<\u002Fp>\n  <div style=\"display:flex;justify-content:space-between;align-items:center;margin-top:30px\">\n    <h2 style=\"font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:24px;margin:0\">October 2026<\u002Fh2>\n    <div style=\"display:flex;gap:4px\">\n      <button aria-label=\"Previous month\" disabled=\"{{ true }}\" style=\"width:40px;height:40px;border:none;background:transparent;color:#5c636a;cursor:default\"><svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"m15 18-6-6 6-6\"><\u002Fpath><\u002Fsvg><\u002Fbutton>\n      <button aria-label=\"Next month\" disabled=\"{{ true }}\" style=\"width:40px;height:40px;border:none;background:transparent;color:#5c636a;cursor:default\"><svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"m9 18 6-6-6-6\"><\u002Fpath><\u002Fsvg><\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:repeat(7,minmax(0,1fr));margin-top:18px;row-gap:8px;text-align:center\">\n    <sc-for list=\"{{ weekdays }}\" as=\"wd\"><div style=\"font-size:14px;color:#9aa3ab;padding-bottom:14px\">{{ wd }}<\u002Fdiv><\u002Fsc-for>\n    <sc-for list=\"{{ cells }}\" as=\"cell\" hint-placeholder-count=\"35\">\n      <button sc-camel-on-click=\"{{ cell.open }}\" disabled=\"{{ cell.disabled }}\" aria-label=\"{{ cell.aria }}\" style=\"height:58px;border:none;background:transparent;display:flex;align-items:center;justify-content:center;cursor:{{ cell.cursor }};padding:0;font-family:'Manrope',sans-serif\">\n        <span style=\"width:58px;max-width:100%;height:50px;border-radius:25px;background:{{ cell.bg }};color:{{ cell.fg }};display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;font-size:17px;font-weight:500\">\n          {{ cell.label }}\n          <span style=\"display:flex;gap:4px;height:5px;opacity:{{ cell.dotOpacity }}\"><span style=\"width:5px;height:5px;border-radius:50%;background:{{ cell.dot1 }}\"><\u002Fspan><span style=\"width:5px;height:5px;border-radius:50%;background:#ff8b85\"><\u002Fspan><\u002Fspan>\n        <\u002Fspan>\n      <\u002Fbutton>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n  <div style=\"display:flex;gap:18px;font-size:13px;color:#9aa3ab;margin-top:18px\">\n    <span style=\"display:flex;align-items:center;gap:6px\"><span style=\"width:6px;height:6px;border-radius:50%;background:#4fdfdc\"><\u002Fspan>Learning day<\u002Fspan>\n    <span style=\"display:flex;align-items:center;gap:6px\"><span style=\"width:6px;height:6px;border-radius:50%;background:#c4a5f5\"><\u002Fspan>Prediction day<\u002Fspan>\n    <span style=\"display:flex;align-items:center;gap:6px\"><span style=\"width:6px;height:6px;border-radius:50%;background:#ff8b85\"><\u002Fspan>Meals logged<\u002Fspan>\n  <\u002Fdiv>\n<\u002Fmain>\n<\u002Fsc-if>\n\n<!-- MEDS -->\n<sc-if value=\"{{ isMeds }}\" hint-placeholder-val=\"{{ false }}\">\n<main data-screen-label=\"Medication\" style=\"padding:20px 20px 0\">\n  <div style=\"font-size:14px;letter-spacing:0.08em;color:#4fdfdc;font-weight:700\">MEDICATION<\u002Fdiv>\n  <h1 style=\"font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:32px;letter-spacing:-0.02em;margin:4px 0 6px\">What did you take?<\u002Fh1>\n  <p style=\"margin:0 0 18px;font-size:15px;line-height:1.5;color:#c3cad0\">Your medication is included when Glympse forecasts your glucose after a meal.<\u002Fp>\n  <div style=\"display:flex;flex-wrap:wrap;gap:8px\">\n    <sc-for list=\"{{ medPresets }}\" as=\"mp\" hint-placeholder-count=\"3\">\n      <button sc-camel-on-click=\"{{ mp.pick }}\" style=\"height:38px;padding:0 14px;border-radius:19px;border:1px solid #33373b;background:transparent;color:#f2f4f5;font:500 14px 'Manrope',sans-serif;cursor:pointer\">{{ mp.label }}<\u002Fbutton>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n  <div style=\"margin-top:18px\">\n    <label for=\"gl-med\" style=\"display:block;font-size:14px;color:#c3cad0;margin-bottom:8px\">Medication name<\u002Flabel>\n    <input id=\"gl-med\" value=\"{{ medForm.name }}\" sc-camel-on-change=\"{{ setMedName }}\" placeholder=\"e.g. Metformin\" style=\"width:100%;height:52px;border-radius:20px;border:1px solid #33373b;background:#25282c;color:#f2f4f5;padding:0 16px;font:500 16px 'Manrope',sans-serif\">\n  <\u002Fdiv>\n  <div style=\"font-size:14px;color:#c3cad0;margin:16px 0 8px\">Type<\u002Fdiv>\n  <div role=\"radiogroup\" aria-label=\"Medication type\" style=\"display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;background:#25282c;border-radius:26px;padding:5px\">\n    <sc-for list=\"{{ medTypes }}\" as=\"mt\" hint-placeholder-count=\"3\">\n      <button role=\"radio\" aria-checked=\"{{ mt.active }}\" sc-camel-on-click=\"{{ mt.select }}\" style=\"height:42px;border-radius:21px;border:none;background:{{ mt.bg }};color:{{ mt.fg }};font:500 14px 'Manrope',sans-serif;cursor:pointer\">{{ mt.label }}<\u002Fbutton>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:16px\">\n    <div><label for=\"gl-dose\" style=\"display:block;font-size:14px;color:#c3cad0;margin-bottom:8px\">Dose ({{ medUnit }})<\u002Flabel><input id=\"gl-dose\" inputmode=\"decimal\" value=\"{{ medForm.dose }}\" sc-camel-on-change=\"{{ setMedDose }}\" style=\"width:100%;height:52px;border-radius:20px;border:1px solid #33373b;background:#25282c;color:#f2f4f5;padding:0 16px;font:500 16px 'Manrope',sans-serif\"><\u002Fdiv>\n    <div><label for=\"gl-time\" style=\"display:block;font-size:14px;color:#c3cad0;margin-bottom:8px\">Time taken<\u002Flabel><input id=\"gl-time\" type=\"time\" value=\"{{ medForm.time }}\" sc-camel-on-change=\"{{ setMedTime }}\" style=\"width:100%;height:52px;border-radius:20px;border:1px solid #33373b;background:#25282c;color:#f2f4f5;padding:0 16px;font:500 16px 'Manrope',sans-serif;color-scheme:dark\"><\u002Fdiv>\n  <\u002Fdiv>\n  <button sc-camel-on-click=\"{{ saveMed }}\" disabled=\"{{ cantSaveMed }}\" style=\"width:100%;height:52px;margin-top:20px;border-radius:26px;border:none;background:#4fdfdc;color:#0f1113;font:700 17px 'Manrope',sans-serif;cursor:pointer;opacity:{{ medSaveOpacity }}\">Save medication<\u002Fbutton>\n\n  <h2 style=\"font-size:19px;font-weight:700;margin:30px 0 4px\">Taken today<\u002Fh2>\n  <sc-for list=\"{{ medsToday }}\" as=\"md\" hint-placeholder-count=\"1\">\n    <div style=\"display:flex;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid #24272b\">\n      <span style=\"width:44px;height:44px;flex:0 0 auto;border-radius:14px;background:#221f2b;color:#c4a5f5;display:flex;align-items:center;justify-content:center\"><svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"m10.5 20.5 10-10a4.95 4.95 0 1 0-7-7l-10 10a4.95 4.95 0 1 0 7 7ZM8.5 8.5l7 7\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n      <div style=\"flex:1;min-width:0\"><div style=\"font-size:16px;font-weight:700\">{{ md.name }}<\u002Fdiv><div style=\"font-size:13px;color:#9aa3ab\">{{ md.detail }}<\u002Fdiv><\u002Fdiv>\n      <button sc-camel-on-click=\"{{ md.remove }}\" aria-label=\"{{ md.removeAria }}\" style=\"width:40px;height:40px;border-radius:50%;border:none;background:transparent;color:#9aa3ab;cursor:pointer;font-size:20px\">×<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fsc-for>\n  <sc-if value=\"{{ noMeds }}\" hint-placeholder-val=\"{{ false }}\"><p style=\"font-size:15px;color:#9aa3ab;margin:8px 0 0\">Nothing logged yet today.<\u002Fp><\u002Fsc-if>\n\n  <h2 style=\"font-size:19px;font-weight:700;margin:30px 0 4px\">Today's forecast<\u002Fh2>\n  <p style=\"margin:0;font-size:14px;line-height:1.5;color:#9aa3ab\">{{ forecastNote }}<\u002Fp>\n  <sc-for list=\"{{ dayForecast }}\" as=\"fc\">\n      <div style=\"background:#1f2225;border-radius:22px;padding:16px;margin-top:10px\">\n        <div style=\"display:flex;justify-content:space-between;align-items:flex-start;gap:10px\">\n          <div style=\"min-width:0\"><div style=\"font-size:16px;font-weight:700\">{{ fc.name }}<\u002Fdiv><div style=\"font-size:13px;color:#9aa3ab\">{{ fc.time }} · {{ fc.carbs }}g carbs<\u002Fdiv><\u002Fdiv>\n          <span style=\"flex:0 0 auto;padding:5px 10px;border-radius:12px;font-size:13px;font-weight:600;background:{{ fc.chipBg }};color:{{ fc.chipFg }}\">{{ fc.status }}<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:12px\">\n          <sc-for list=\"{{ fc.h }}\" as=\"hz\">\n            <div style=\"background:#25282c;border-radius:14px;padding:10px 4px;text-align:center\"><div style=\"font-size:12px;color:#9aa3ab\">{{ hz.label }}<\u002Fdiv><div style=\"font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:21px;color:{{ hz.color }}\">{{ hz.v }}<\u002Fdiv><div style=\"font-size:11px;color:#9aa3ab\">{{ hz.clock }}<\u002Fdiv><\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"margin-top:10px;font-size:14px;line-height:1.45;color:#e3e7ea\">{{ fc.peakText }}<\u002Fdiv>\n        <sc-if value=\"{{ fc.hasActual }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"margin-top:4px;font-size:13px;color:#9aa3ab\">{{ fc.actualText }}<\u002Fdiv><\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n  <p style=\"font-size:12px;color:#7d868e;margin:20px 0 0\">Wellness insight, not medical advice. Don't change medication without your care team.<\u002Fp>\n<\u002Fmain>\n<\u002Fsc-if>\n\n<!-- REMINDERS -->\n<sc-if value=\"{{ isReminders }}\" hint-placeholder-val=\"{{ false }}\">\n<main data-screen-label=\"Reminders\" style=\"padding:20px 20px 0\">\n  <header style=\"display:flex;justify-content:space-between;align-items:flex-start\">\n    <div>\n      <div style=\"font-size:15px;color:#c3cad0\">{{ greeting }}, Shreya<\u002Fdiv>\n      <div style=\"font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:34px;letter-spacing:-0.03em;line-height:1.1\"><span style=\"color:#4fdfdc\">gly<\u002Fspan><span style=\"color:#ff8b85\">mpse<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fheader>\n  <div style=\"margin-top:28px;background:#103534;border-radius:28px;padding:20px\">\n    <div style=\"display:flex;align-items:center;gap:8px;color:#4fdfdc;font-size:18px;font-weight:700\"><svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9M10.3 21a1.94 1.94 0 0 0 3.4 0\"><\u002Fpath><\u002Fsvg>Smart nudges<\u002Fdiv>\n    <p style=\"margin:8px 0 0;font-size:15px;line-height:1.5;color:#c3cad0\">We'll also remind you if your glucose rises and no meal was logged in the last 30 minutes.<\u002Fp>\n  <\u002Fdiv>\n  <div style=\"margin-top:12px\">\n    <sc-for list=\"{{ reminders }}\" as=\"rm\" hint-placeholder-count=\"3\">\n      <div style=\"display:flex;justify-content:space-between;align-items:center;gap:12px;padding:22px 0;border-bottom:1px solid #24272b\">\n        <div><div style=\"font-size:18px;font-weight:700\">{{ rm.label }}<\u002Fdiv><div style=\"font-size:15px;color:#9aa3ab;margin-top:2px\">{{ rm.time }} · daily<\u002Fdiv><\u002Fdiv>\n        <button role=\"switch\" aria-checked=\"{{ rm.on }}\" aria-label=\"{{ rm.aria }}\" sc-camel-on-click=\"{{ rm.toggle }}\" style=\"width:60px;height:34px;border-radius:17px;border:none;background:{{ rm.track }};padding:4px;display:flex;justify-content:{{ rm.justify }};cursor:pointer\"><span style=\"width:26px;height:26px;border-radius:50%;background:#e8edf0\"><\u002Fspan><\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n<\u002Fmain>\n<\u002Fsc-if>\n\n<!-- PROFILE -->\n<sc-if value=\"{{ isProfile }}\" hint-placeholder-val=\"{{ false }}\">\n<main data-screen-label=\"Profile\" style=\"padding:20px 20px 0\">\n  <header style=\"display:flex;justify-content:space-between;align-items:center\">\n    <div style=\"font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:34px;letter-spacing:-0.03em\"><span style=\"color:#4fdfdc\">gly<\u002Fspan><span style=\"color:#ff8b85\">mpse<\u002Fspan><\u002Fdiv>\n    <span style=\"padding:7px 14px;border-radius:16px;border:1px solid #33373b;font-size:12px;color:#c3cad0;letter-spacing:0.04em\">DEMO MODE<\u002Fspan>\n  <\u002Fheader>\n  <div style=\"font-size:14px;letter-spacing:0.08em;color:#4fdfdc;font-weight:700;margin-top:28px\">YOUR PROFILE<\u002Fdiv>\n  <h1 style=\"font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:34px;letter-spacing:-0.02em;margin:4px 0 0\">Made for you.<\u002Fh1>\n  <div style=\"display:flex;flex-direction:column;align-items:center;margin-top:24px\">\n    <div style=\"position:relative;width:136px;height:136px;border-radius:50%;border:2px solid #c4a5f5;background:#1f2228;display:flex;align-items:center;justify-content:center;color:#c4a5f5\">\n      <svg width=\"44\" height=\"44\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2M12 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8z\"><\u002Fpath><\u002Fsvg>\n      <span style=\"position:absolute;right:-2px;bottom:6px;width:36px;height:36px;border-radius:50%;background:#ff8b85;border:3px solid #0f1113;display:flex;align-items:center;justify-content:center;color:#0f1113\"><svg width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:28px;margin-top:18px\">Shreya Dutt<\u002Fdiv>\n    <div style=\"font-size:16px;color:#9aa3ab;margin-top:4px\">shreya@example.com<\u002Fdiv>\n    <button style=\"margin-top:14px;height:40px;padding:0 14px;border:none;background:transparent;color:#4fdfdc;font:600 16px 'Manrope',sans-serif;display:flex;align-items:center;gap:8px;cursor:pointe rder-bottom:none;border-radius:32px 32px 0 0;padding:14px 20px 32px;z-index:31\">\n    <button sc-camel-on-click=\"{{ closeSheet }}\" aria-label=\"Close\" style=\"display:block;margin:0 auto;width:120px;height:20px;border:none;background:transparent;cursor:pointer;padding:6px 0\"><span style=\"display:block;height:7px;border-radius:4px;background:#2f3a44\"><\u002Fspan><\u002Fbutton>\n    <h2 style=\"font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:26px;margin:16px 0 4px\">{{ sheet.title }}<\u002Fh2>\n    <p style=\"font-size:16px;color:#c3cad0;margin:0\">{{ sheet.subtitle }}<\u002Fp>\n    <div style=\"display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:16px\">\n      <div style=\"background:#103534;border-radius:14px;padding:18px\">\n        <svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#4fdfdc\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 22a7 7 0 0 0 7-7c0-2-1-3.9-3-5.5s-3.5-4-4-6.5c-.5 2.5-2 4.9-4 6.5C6 11.1 5 13 5 15a7 7 0 0 0 7 7z\"><\u002Fpath><\u002Fsvg>\n        <div style=\"margin-top:12px\"><span style=\"font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:34px\">{{ sheet.avg }}<\u002Fspan> <span style=\"font-size:14px;font-weight:600;color:#c3cad0\">mg/dL<\u002Fspan><\u002Fdiv>\n        <div style=\"font-size:15px;color:#c3cad0\">Average glucose<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#221f2b;border-radius:14px;padding:18px;display:flex;flex-direction:column;justify-content:center\">\n        <div style=\"display:flex;align-items:center;gap:12px\">\n          <svg width=\"50\" height=\"50\" sc-camel-view-box=\"0 0 50 50\" aria-hidden=\"true\"><circle cx=\"25\" cy=\"25\" r=\"20\" style=\"fill:none;stroke:#3a3346;stroke-width:5\"><\u002Fcircle><circle cx=\"25\" cy=\"25\" r=\"20\" transform=\"rotate(-90 25 25)\" style=\"fill:none;stroke:#c4a5f5;stroke-width:5;stroke-linecap:round;stroke-dasharray:{{ shee This should sit well with your glucose.'};\n// MODEL HOOK: replace the body with a call to the trained model (uses the person's first 7 days).\n// Input: {name, c, p, f}. Return: {mightSpike: boolean, probability: 0-1, peak: mg/dL, confidence: 'low'|'medium'|'high'}\n// Input: meal {name,c,p,f,t (minutes since midnight)}, meds [{name,type:'tablet'|'rapid'|'long',dose,t}].\n// Return: {h:[{min:30,v},{min:60,v},{min:90,v},{min:120,v}], peak, peakAfter (min), rises, mightSpike, probability 0-1, confidence}\nasync function predictGlucose(meal,meds){await new Promise(r=>setTimeout(r,800));return forecast(meal,meds)}\nconst MED_TYPES=[['tablet','Tablet','mg'],['rapid','Rapid insulin','units'],['long','Long insulin','units']];\nconst MED_PRESETS=[{name:'Metformin',type:'tablet',dose:500},{name:'Rapid-acting insulin',type:'rapid',dose:4},{name:'Long-acting insulin',type:'long',dose:10}];\nconst DAILY_MEDS=[{name:'Metformin',type:'tablet',dose:500,t:480},{name:'Metformin',type:'tablet',dose:500,t:1140}];\nconst BASE=105;\nconst bumpAt=(t,tp)=>t<=0?0:Math.pow(t/tp,2)*Math.exp(2*(1-t/tp));\nconst unitOf=type=>(MED_TYPES.find(x=>x[0]===type)||MED_TYPES[0])[2];\nfunction forecast(meal,meds){\n let A=Math.max(0,predict(meal.c,meal.p,meal.f).peak-BASE);\n const tp=Math.max(35,Math.min(85,35+meal.f*1.2+meal.p*0.4));\n const before=meds.filter(m=>m.t<=meal.t+30);\n if(before.some(m=>m.type==='tablet'))A*=0.9;\n if(before.some(m=>m.type==='long'))A*=0.9;\n const rapid=meds.filter(m=>m.type==='rapid'&&Math.abs(m.t-meal.t)<=60);\n const g=t=>BASE+A*bumpAt(t,tp)-rapid.reduce((s,m)=>s+m.dose*3*bumpAt(t+meal.t-m.t,70),0);\n let peak=-1,pa=0;for(let t=0;t<=180;t+=5){const v=g(t);if(v>peak){peak=v;pa=t}}\n peak=Math.round(peak);\n const prob=Math.max(3,Math.min(96,Math.round(100/(1+Math.exp(-(peak-138)/6)))));\n return {h:[30,60,90,120].map(m=>({min:m,v:Math.round(g(m))})),peak,peakAfter:pa,rises:peak-BASE>=8,mightSpike:peak>140,probability:prob/100,confidence:(prob>80||prob<20)?'high':'med
